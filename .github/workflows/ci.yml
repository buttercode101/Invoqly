name: CI
on:
  pull_request:
  push:
    branches: [main, feat/guest-first-workspace-pr5, feat/invoqly-production]
concurrency:
  group: invoqly-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invoqly
          POSTGRES_PASSWORD: invoqly_test
          POSTGRES_DB: invoqly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoqly -d invoqly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://invoqly:invoqly_test@127.0.0.1:5432/invoqly_test
      BETTER_AUTH_SECRET: 5b8d2b7a43f1b0e4f5d8c7a6b9e2d1f0c4a8e6b2d7f9a1c3e5b7d0f2a4c6e8b1
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUTH_EMAIL_VERIFICATION: "false"
      CLOUDFLARE_HYPERDRIVE_ID: 00000000-0000-0000-0000-000000000000
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://invoqly:invoqly_test@127.0.0.1:5432/invoqly_test
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --include=dev
      - run: npx cf workers types
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
