name: Cloudflare compatibility build

on:
  pull_request:
    branches: [main, feat/invoqly-production]
  push:
    branches: [cloudflare/production-migration]

concurrency:
  group: invoqly-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invoqly
          POSTGRES_PASSWORD: invoqly_test
          POSTGRES_DB: invoqly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoqly -d invoqly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://invoqly:invoqly_test@127.0.0.1:5432/invoqly_test
      BETTER_AUTH_SECRET: 5b8d2b7a43f1b0e4f5d8c7a6b9e2d1f0c4a8e6b2d7f9a1c3e5b7d0f2a4c6e8b1
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUTH_EMAIL_VERIFICATION: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for the adapter additions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare
      - name: Validate Wrangler bundle without deploying
        run: npx wrangler deploy --dry-run --outdir=cloudflare-dry-run
