name: Deploy Invoqly production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoqly-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 90cefa028781f749f5816c5748f04cd2
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_PRODUCTION_HYPERDRIVE_ID }}
      INVOQLY_WORKER_NAME: invoqly-production
      AUTH_EMAIL_VERIFICATION: "false"
      BETTER_AUTH_URL: https://invoqly-production.buttercoder-dev.workers.dev
      NEXT_PUBLIC_APP_URL: https://invoqly-production.buttercoder-dev.workers.dev
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      NODE_ENV: production
    steps:
      - name: Check production credentials and isolated database binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$BETTER_AUTH_SECRET" || { echo "::error::Missing BETTER_AUTH_SECRET"; exit 1; }
          test -n "$CLOUDFLARE_HYPERDRIVE_ID" || { echo "::error::Missing CLOUDFLARE_PRODUCTION_HYPERDRIVE_ID repository variable"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --include=dev
      - name: Verify production build gates
        run: |
          npm audit --audit-level=high
          npx cf workers types
          npm run typecheck
          npm test
          npm run build:vinext
      - name: Deploy production Worker with first-version secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(".worker-secrets.json", JSON.stringify({ BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET }), { mode: 0o600 });'
          npx cf deploy --prebuilt --mode production --secrets-file .worker-secrets.json
          rm -f .worker-secrets.json
      - name: Verify production Worker and production database
        env:
          PRODUCTION_URL: https://invoqly-production.buttercoder-dev.workers.dev
        run: |
          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent "$PRODUCTION_URL/api/health" || true)
            if [ -n "$response" ] && echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.status==="ok"&&x.database==="ok"?0:1)}catch{process.exit(1)}})'; then
              echo "Production Worker and production Hyperdrive database are healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production Worker or production database health check failed."
          exit 1
