name: Preview E2E
on:
  push:
    branches: [feat/invoqly-production]
concurrency:
  group: invoqly-preview-e2e
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://invoqly-git-feat-invoqly-production-butters-projects-ad226a08.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the branch preview to respond
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL/sign-in" >/dev/null; then
              echo "Preview is responding."
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become available within 10 minutes."
          exit 1
      - name: Run full browser workflows against isolated preview database
        run: npm run test:e2e:remote
