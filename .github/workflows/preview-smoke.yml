name: Preview E2E
on:
  push:
    branches: [feat/invoqly-production]
concurrency:
  group: invoqly-preview-e2e
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://invoqly-git-feat-invoqly-production-butters-projects-ad226a08.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this exact commit and its isolated database
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            response=$(curl --fail --silent "$PLAYWRIGHT_BASE_URL/api/health" || true)
            if [ -n "$response" ] && echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.status==="ok"&&x.database==="ok"&&x.commit===process.env.EXPECTED_SHA?0:1)}catch{process.exit(1)}})'; then
              echo "Preview and its database are healthy on $EXPECTED_SHA."
              exit 0
            fi
            sleep 10
          done
          echo "The exact preview commit did not become healthy within 10 minutes."
          exit 1
      - name: Run full browser workflows against isolated preview database
        run: npm run test:e2e:remote
