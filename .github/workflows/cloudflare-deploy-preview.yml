name: Deploy Cloudflare preview

on:
  push:
    branches: [feat/cloudflare-invoqly-production, feat/invoqly-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoqly-cloudflare-preview-deploy
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 90cefa028781f749f5816c5748f04cd2
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      INVOQLY_RECEIPTS_BUCKET: invoqly-receipts-preview
      AUTH_EMAIL_VERIFICATION: "false"
      BETTER_AUTH_URL: https://invoqly-preview.buttercoder-dev.workers.dev
      NEXT_PUBLIC_APP_URL: https://invoqly-preview.buttercoder-dev.workers.dev
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      NODE_ENV: production
    steps:
      # Repository secrets are injected at job runtime; this gate prevents accidental unauthenticated deploys.
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add CLOUDFLARE_API_TOKEN and BETTER_AUTH_SECRET repository secrets to enable remote preview deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Cloudflare account token access
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          verify=$(curl --silent --show-error --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$verify" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.success||x.result?.status!=="active"){console.error("Cloudflare API token is not active.");process.exit(1)}console.log("Cloudflare API token is active.")})'
          account=$(curl --silent --show-error --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "$account" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.success){console.error("Token cannot access Workers scripts in the configured account.");process.exit(1)}console.log("Cloudflare account and Workers scripts read access verified.")})'
      - uses: actions/checkout@v5
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for the candidate dependency graph
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci --include=dev
      - name: Dependency security audit
        if: steps.credentials.outputs.ready == 'true'
        run: npm audit --audit-level=high
      - name: Generate Cloudflare binding types
        run: npx cf workers types

      - name: TypeScript
        if: steps.credentials.outputs.ready == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.credentials.outputs.ready == 'true'
        run: npm test
      - name: Build and deploy the isolated preview Worker with its first-version secret
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build:vinext
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(".worker-secrets.json", JSON.stringify({ BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET }), { mode: 0o600 });'
          npx cf deploy --prebuilt --mode production --secrets-file .worker-secrets.json
          rm -f .worker-secrets.json
      - name: Verify the deployed Worker and Hyperdrive database
        if: steps.credentials.outputs.ready == 'true'
        env:
          PREVIEW_URL: https://invoqly-preview.buttercoder-dev.workers.dev
        run: |
          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent "$PREVIEW_URL/api/health" || true)
            if [ -n "$response" ] && echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.status==="ok"&&x.database==="ok"?0:1)}catch{process.exit(1)}})'; then
              echo "Cloudflare preview and Hyperdrive database are healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare preview did not become healthy. Inspect Worker logs."
          exit 1
      - name: Install Playwright Chromium
        if: steps.credentials.outputs.ready == 'true'
        run: npx playwright install chromium --with-deps
      - name: Run guest, VAT and live AI browser acceptance against remote preview
        if: steps.credentials.outputs.ready == 'true'
        env:
          PLAYWRIGHT_BASE_URL: https://invoqly-preview.buttercoder-dev.workers.dev
          RUN_REMOTE_AI_E2E: "1"
          RUN_REMOTE_RECEIPT_E2E: "1"
          CI: "true"
        run: npx playwright test e2e/guest-remote.spec.ts e2e/vat-documents.spec.ts e2e/assistant-remote.spec.ts e2e/assistant-payment-remote.spec.ts e2e/expense-receipt-remote.spec.ts e2e/offline.spec.ts e2e/theme.spec.ts e2e/guest-backup-share.spec.ts --workers=1
      - name: Verify signed-in workspace API and full account workflow
        if: always() && steps.credentials.outputs.ready == 'true'
        env:
          PLAYWRIGHT_BASE_URL: https://invoqly-preview.buttercoder-dev.workers.dev
          CI: "true"
        run: npx playwright test e2e/workspace.spec.ts --grep "real account, client" --workers=1
      - name: Upload browser acceptance diagnostics
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: invoqly-preview-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
