name: Cloudflare compatibility check

on:
  push:
    branches:
      - experiment/cloudflare-vinext-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoqly-cloudflare-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Inspect and build Invoqly with vinext
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the exact committed dependency graph
        run: npm ci
      - name: Run Cloudflare's recommended compatibility scan
        run: npx --yes vinext check
      - name: Initialise a non-destructive Cloudflare Workers test setup
        run: npx --yes vinext init --platform=cloudflare --name=invoqly --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Apply narrowly scoped patches for the reported dependency ranges
        run: |
          npm pkg set 'devDependencies.vite=^8.3.3' 'overrides.fflate=^0.7.5'
          npm install
      - name: Require a clean audit after the targeted patches
        run: npm audit --audit-level=moderate
      - name: Type-check the migrated test workspace
        run: npm run typecheck
      - name: Build the Cloudflare-targeted application
        run: npm run build:vinext
      - name: Run unit tests
        run: npm test
      - name: Install Chromium for the workerd browser suite
        run: npx playwright install --with-deps chromium
      - name: Exercise the app in Cloudflare's local workerd runtime
        run: npx playwright test --config=playwright.vinext.config.ts
      - name: Preserve workerd browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoqly-workerd-playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
