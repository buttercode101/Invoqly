name: Cloudflare compatibility check

on:
  push:
    branches:
      - experiment/cloudflare-vinext-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoqly-cloudflare-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Inspect and build Invoqly with vinext
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the exact committed dependency graph
        run: npm ci
      - name: Run Cloudflare's recommended compatibility scan
        run: npx --yes vinext check
      - name: Initialise a non-destructive Cloudflare Workers test setup
        run: npx --yes vinext init --platform=cloudflare --name=invoqly --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Report dependency advisories introduced by vinext init
        run: |
          npm audit --json > /tmp/invoqly-vinext-audit.json || true
          node -e 'const a=require("/tmp/invoqly-vinext-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,via:v.via,range:v.range,fixAvailable:v.fixAvailable}))},null,2))'
      - name: Type-check the migrated test workspace
        run: npm run typecheck
      - name: Build the Cloudflare-targeted application
        run: npm run build:vinext
      - name: Run unit tests
        run: npm test
